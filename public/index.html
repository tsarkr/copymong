<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>카피몽 — 리뷰답글 & 마케팅 문구 AI 생성기</title>
<style>
  body{font-family:-apple-system,'Malgun Gothic',sans-serif;max-width:860px;margin:0 auto;padding:20px;background:#faf7f2;color:#222}
  h1{font-size:26px;margin-bottom:4px} .sub{color:#666;margin-bottom:20px}
  .card{background:#fff;border:1px solid #e8e0d4;border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;font-weight:600;margin:10px 0 4px} input,textarea,select{width:100%;padding:9px;border:1px solid #ccc;border-radius:8px;box-sizing:border-box;font-size:15px}
  textarea{min-height:80px} button{background:#ff7a00;color:#fff;border:0;padding:11px 20px;border-radius:8px;font-size:16px;cursor:pointer;margin-top:14px}
  button:disabled{opacity:.5} .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;cursor:pointer}
  .tab.on{background:#222;color:#fff} pre{white-space:pre-wrap;background:#fffdf8;border:1px solid #eee;padding:14px;border-radius:8px;min-height:60px}
  .hint{font-size:13px;color:#888}
</style>
</head>
<body>
<h1>🐵 카피몽</h1>
<p class="sub">네이버 리뷰 답글 · 스마트스토어 상품설명 · 블로그 글 · 인스타 캡션을 한 번에. 만든 문구는 복사해서 네이버/인스타에 바로 붙여넣으세요.</p>

<div class="card">
  <label>내 Gemini API 키 (선택 — 서버에 키가 설정돼 있으면 비워두세요)</label>
  <input id="apiKey" type="password" placeholder="Google AI Studio에서 무료 발급 (aistudio.google.com/apikey)">
  <p class="hint">키는 브라우저에 저장되지 않고, 생성 요청 때만 전송됩니다.</p>
</div>

<div class="tabs">
  <button class="tab on" data-tool="review">⭐ 리뷰 답글</button>
  <button class="tab" data-tool="product">🛍️ 상품 설명</button>
  <button class="tab" data-tool="blog">✍️ 블로그 글</button>
  <button class="tab" data-tool="insta">📸 인스타 캡션</button>
</div>

<div class="card" id="form"></div>

<div class="card">
  <button id="go">문구 만들기</button>
  <button id="copy" style="background:#444">결과 복사</button>
  <pre id="out">결과가 여기에 나옵니다.</pre>
</div>

<script>
const FORMS = {
  review: [
    ['storeName','가게 이름 (선택)','예: 몽몽분식'],
    ['tone','말투','정중하게 / 친근하게 / 유머러스하게 중 하나 입력'],
    ['rating','별점','예: 5'],
    ['reviewText','고객 리뷰 원문','리뷰를 그대로 붙여넣으세요'],
  ],
  product: [
    ['productName','상품명','예: 수제 딸기청 500ml'],
    ['features','상품 특징','재료, 용량, 장점을 쉼표로'],
    ['target','타겟 고객','예: 홈카페를 즐기는 30대'],
    ['price','가격 (선택)','예: 12,900원'],
  ],
  blog: [
    ['keyword','메인 키워드','예: 강남 떡볶이 맛집 / 겨울 타이어 교체'],
    ['topic','글 주제','무엇을 소개하는 글인지'],
    ['storeName','가게/브랜드 이름 (선택)',''],
  ],
  insta: [
    ['topic','게시물 주제','예: 신메뉴 딸기라떼 출시'],
    ['mood','분위기','예: 발랄하게 / 감성적으로'],
    ['storeName','가게 이름 (선택)',''],
  ],
};
let tool = 'review';
const formEl = document.getElementById('form');
function render(){
  formEl.innerHTML = FORMS[tool].map(([k,label,ph]) =>
    `<label>${label}</label>${k==='reviewText'||k==='features'||k==='topic' ? `<textarea data-k="${k}" placeholder="${ph}"></textarea>` : `<input data-k="${k}" placeholder="${ph}">`}`
  ).join('');
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on')); t.classList.add('on');
  tool = t.dataset.tool; render();
});
render();
document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go'); const out = document.getElementById('out');
  const input = {}; formEl.querySelectorAll('[data-k]').forEach(el => input[el.dataset.k] = el.value);
  btn.disabled = true; out.textContent = '만드는 중... (10~20초 걸릴 수 있어요)';
  try {
    const r = await fetch('/api/generate', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({tool, input, apiKey: document.getElementById('apiKey').value})});
    const d = await r.json();
    out.textContent = d.result || ('오류: ' + (d.error||'알 수 없음'));
  } catch(e){ out.textContent = '오류: ' + e.message; }
  btn.disabled = false;
};
document.getElementById('copy').onclick = () => navigator.clipboard.writeText(document.getElementById('out').textContent);
</script>
</body>
</html>
